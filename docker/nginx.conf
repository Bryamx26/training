# Production : nginx sert le front compilé (dist/). Le front appelle l'API sur
# son propre sous-domaine (API_URL, compilé dans le JS) : aucune requête /api
# ne passe par ce serveur.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # Fichiers versionnés par Vite (nom avec empreinte) : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker et manifeste : toujours revalidés, pour que les mises à jour arrivent.
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # Application monopage : toute autre route renvoie index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
