# Production : nginx sert le front compilé (dist/) et relaie /api vers l'API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Taille max d'une requête (aligné sur express.json de l'API).
  client_max_body_size 200k;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers versionnés par Vite (nom avec empreinte) : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker et manifeste : toujours revalidés, pour que les mises à jour arrivent.
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # Application monopage : toute autre route renvoie index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
