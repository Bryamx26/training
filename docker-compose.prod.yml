# Production : docker compose -f docker-compose.prod.yml up -d --build
# Deux sous-domaines, derrière un reverse proxy HTTPS sur le serveur :
#   FRONT_URL (ex. https://sport-track.mon-domaine.fr)     -> port WEB_PORT (80)
#   API_URL   (ex. https://api-sport-track.mon-domaine.fr) -> port API_PORT (4000)
# Changer API_URL impose de reconstruire le front (--build) : la valeur est
# écrite dans le JavaScript compilé.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.prod.Dockerfile
    image: bryamx26/api-training-app:1.2 # nom / repo : version
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:/data/sport.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être défini dans .env (voir .env.example)}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - AUTH_RATE_LIMIT=${AUTH_RATE_LIMIT:-10}
      # Le front appelle l'API depuis son propre sous-domaine : origine autorisée (CORS).
      - CORS_ORIGIN=${FRONT_URL:?FRONT_URL doit être défini dans .env (voir .env.example)}
      # Un seul reverse proxy devant l'API : on lui fait confiance pour l'IP du client.
      - TRUST_PROXY=1
    ports:
      # Exposé seulement sur la machine : le reverse proxy HTTPS le publie sur API_URL.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - api_data:/data

  web:
    build:
      context: .
      dockerfile: docker/web.prod.Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
        - VITE_API_URL=${API_URL:?API_URL doit être défini dans .env (voir .env.example)}
    image: bryamx26/frontend-training-app:1.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  api_data:
